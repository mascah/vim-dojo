version: 2

project_name: vim-dojo

builds:
  - id: dojo
    main: .
    binary: dojo
    # Pure Go, so every target cross-compiles from one Linux runner.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: vim-dojo
    # No version in the name, so releases/latest/download/<name> always works
    # for install.sh.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # dojo reads the lessons next to it and hands Vim this folder as its
    # runtime, so the archive is the whole plugin, and a Vim package too.
    files:
      - README.md
      - lessons
      - snippets
      - autoload
      - plugin

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

# release-please writes CHANGELOG.md and creates the GitHub Release; GoReleaser
# only uploads the archives onto it, leaving its notes alone.
changelog:
  disable: true

release:
  mode: keep-existing
