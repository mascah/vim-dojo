apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels:
    app: checkout
    team: "payments"
spec:
  replicas: 3  # one per zone
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: "registry.example.test/checkout:2.4.0"
          ports:
            - containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "checkout-db"
                  key: "url"
          resources:
            requests:
              cpu: "250m"  # a quarter of a core
              memory: "256Mi"
            limits:
              memory: "512Mi"  # killed above this
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: 8080
