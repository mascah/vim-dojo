# The Vim suite takes most of a minute, so tests stay out of this hook; run
# `just check` before committing instead. snippets/ is drill text, so gofmt
# leaves it alone.
pre-commit:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      exclude:
        - "snippets/**"
      run: gofmt -w {staged_files}
      stage_fixed: true
    - name: vet
      glob: "*.go"
      run: go vet ./...
    - name: mod-tidy
      glob: "{*.go,go.mod,go.sum}"
      run: go mod tidy -diff
